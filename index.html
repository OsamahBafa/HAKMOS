<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HAKMOS | Cyber Sovereign Protocol v133</title>
    
    <!-- الخطوط -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Cairo:wght@300;400;700&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-void: #010102;
            --cyber-gold: #E5A93B;
            --cyber-gold-glow: rgba(229, 169, 59, 0.25);
            --text-pure: #FFFFFF;
            --text-dim: #6E6E73;
            --panel-border: rgba(229, 169, 59, 0.15);
            --font-ar: 'Cairo', sans-serif;
            --font-en: 'Orbitron', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        
        body {
            background-color: var(--bg-void); 
            color: var(--text-pure); 
            height: 100vh;
            display: flex; 
            align-items: center; 
            justify-content: center; 
            overflow: hidden; 
            position: relative;
            font-family: var(--font-ar);
            background-image: 
                linear-gradient(to right, rgba(229, 169, 59, 0.015) 1px, transparent 1px), 
                linear-gradient(to bottom, rgba(229, 169, 59, 0.015) 1px, transparent 1px);
            background-size: 40px 40px;
            transition: font-family 0.3s ease;
        }

        /* كانفاس الجسيمات المتفاعلة */
        #particleCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* شعاع توهج الماوس Dynamic Dynamic Glow */
        .cursor-glow {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(229, 169, 59, 0.06) 0%, rgba(0,0,0,0) 70%);
            transform: translate(-50%, -50%);
            z-index: 1;
            pointer-events: none;
            transition: width 0.3s, height 0.3s;
        }

        .cinematic-container { position: relative; z-index: 2; width: 100%; max-width: 760px; padding: 20px; text-align: center; }
        
        .main-logo {
            font-family: var(--font-en); font-weight: 900; font-size: 3.8rem; letter-spacing: 16px; text-indent: 16px; text-transform: uppercase;
            background: linear-gradient(180deg, #FFFFFF 30%, var(--cyber-gold) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 15px rgba(229, 169, 59, 0.2)); margin-bottom: 32px; transition: transform 0.5s ease;
        }

        .console-box { width: 100%; max-width: 560px; margin: 0 auto 28px auto; }
        .console-input {
            width: 100%; background: rgba(255, 255, 255, 0.015); border: 1px solid var(--panel-border);
            border-radius: 6px; padding: 18px 24px; color: var(--text-pure); font-size: 1rem;
            text-align: center; outline: none; transition: all 0.4s ease;
        }
        .console-input:focus { border-color: var(--cyber-gold); box-shadow: 0 0 25px var(--cyber-gold-glow); background: rgba(229, 169, 59, 0.02); }
        .console-input::placeholder { transition: opacity 0.3s ease; }

        .manifest-output {
            max-height: 320px; overflow-y: auto; font-size: 1rem; text-align: justify; line-height: 1.8;
            color: rgba(255, 255, 255, 0.88); padding: 16px 20px; margin-bottom: 28px; display: none;
            border-inline-start: 3px solid var(--cyber-gold); background: rgba(255, 255, 255, 0.008); border-radius: 4px;
        }
        .manifest-output::-webkit-scrollbar { width: 4px; }
        .manifest-output::-webkit-scrollbar-thumb { background: var(--cyber-gold); border-radius: 2px; }

        .gate-highlight { color: var(--cyber-gold); font-weight: 700; font-family: var(--font-en); display: inline-block; margin: 0 4px; }
        .terminal-anchor { font-size: 0.9rem; color: var(--text-dim); letter-spacing: 2px; transition: color 0.3s; }

        @media (max-width: 768px) {
            .main-logo { font-size: 2.5rem; letter-spacing: 8px; text-indent: 8px; }
            .console-input { font-size: 0.9rem; padding: 14px; }
        }
    </style>
</head>
<body>

    <canvas id="particleCanvas"></canvas>
    <div class="cursor-glow" id="cursorGlow"></div>

    <div class="cinematic-container">
        <div class="brand-header" id="brandHeader">
            <div class="main-logo">Hakmos</div>
        </div>
        
        <div class="manifest-output" id="manifestOutput"></div>

        <div class="console-box">
            <input type="text" class="console-input" id="magicConsole" autocomplete="off">
        </div>
        
        <div class="terminal-anchor" id="statusAnchor"></div>
    </div>

    <script>
        let currentLang = 'ar';
        let typingTimer = null;

        const i18n = {
            ar: {
                placeholder: "اطرح مخاوفك، شكوكك، أو أوامرك لفتح الأبعاد...",
                waiting: "بانتظار أمر السيادة المكتوب_",
                connecting: "جاري الاتصال بـ بروتوكول الحقيقة وتدقيق الهوية العتادية...",
                success: "تم بث نداء العبور الأول بنجاح وسحق الزيف_",
                processed: "تمت معالجة الاستعلام السيادي بنجاح_",
                database: {
                    manifest: `
                        <span class="gate-highlight">[ HAKMOS LAUNCH MANIFEST v133 ]</span><br><br>
                        <b>إلى النخبة العابرة لزيف العالم الرقمي.. حان وقت الانبعاث السيادي وثورة العقول الحرة.</b><br><br>
                        لقد استنزفت المنصات التقليدية وجودكم، وتداولت بياناتكم الحية، وحولت إنسانيتكم إلى سلعة في مزاد الإعلانات. اليوم، نعلن نهاية عصر التبعية، وبداية زمن السيادة المطلقة.<br><br>
                        منصة <span class="gate-highlight">HAKMOS</span> تطلق بروتوكول الحياة الحقيقي السداسي الموحد:<br><br>
                        <span class="gate-highlight">🩺 [H] Holistic:</span> العيادة السيادية - تتبع صحي وعلاج بيولوجي مع حماية كاملة للخصوصية.<br>
                        <span class="gate-highlight">💍 [A] Aligned:</span> الحصن العائلي - عقد زواج فطري ونظيف بعيداً عن مساحيق الزيف.<br>
                        <span class="gate-highlight">💼 [K] Kinetic:</span> محرك الارتقاء - توظيف أعمى يسحق المحسوبية ويقدس الموهبة.<br>
                        <span class="gate-highlight">💰 [M] Monetary:</span> بيت المال - إدارة أصول ومزادات وسحب نقدي P2P مطهر ضريبياً.<br>
                        <span class="gate-highlight">🎬 [O] Original:</span> الديوان الأسود - مطارحات فكرية وصحافة محمية من استنساخ الصوت.<br>
                        <span class="gate-highlight">👑 [S] Sovereign:</span> الهدف الأسمى - استعادة التحكم الكامل بمصيرك الشامل.<br><br>
                        <span class="gate-highlight">تنفس هدوء الحقيقة.. واستشعر اقتراب اللحظة التي تضع فيها وثيقة حضورك وجوازك بين يدي البروتوكول، لتنفتح أمامك التأشيرة الذهبية؛ معبراً أبدياً نحو أبعاد السيادة...</span>
                    `,
                    privacy: "أرح عقلك؛ دع السكينة تتسلل إلى وعيك وأنت تدرك أن بياناتك ومشاعرك مصانة بالكامل. المنصة لا تخزن هويتك لتبيعها؛ وحينما تدنو ساعة العبور الكامل، ستكون وثيقتك وجوازك مفتاحك الوحيد لمنحك التأشيرة الذهبية المشفّرة عتادياً بصيغة التشفير الصفري (ZK-Proofs).",
                    money: "الأموال داخل بيت المال لا يتم احتجازها؛ كل التسييل يتم بنظام المقاصة بالند للند (P2P) ويصل ليدك كاش بنقاء ضريبي 100% عبر عقود Deel وبصفر رادارات بنكية."
                }
            },
            en: {
                placeholder: "Enter your fears, doubts, or commands to unlock dimensions...",
                waiting: "Awaiting sovereign command execution_",
                connecting: "Connecting to Truth Protocol & verifying hardware identity...",
                success: "First passage manifest deployed. Illusions dismantled_",
                processed: "Sovereign query processed successfully_",
                database: {
                    manifest: `
                        <span class="gate-highlight">[ HAKMOS LAUNCH MANIFEST v133 ]</span><br><br>
                        <b>To the transcendent elite escaping digital deception.. The era of sovereign revival is here.</b><br><br>
                        Conventional platforms have exhausted our existence and commercialized our living consciousness. Today, we declare the end of digital servitude and the dawn of absolute personal sovereignty.<br><br>
                        <span class="gate-highlight">HAKMOS</span> introduces the Unified Hexagon Protocol:<br><br>
                        <span class="gate-highlight">🩺 [H] Holistic:</span> Sovereign Health - Zero-privacy exposure biometrics.<br>
                        <span class="gate-highlight">💍 [A] Aligned:</span> Family Fortress - Pure, natural matrimonial pairing.<br>
                        <span class="gate-highlight">💼 [K] Kinetic:</span> Merit Engine - Blind hiring prioritizing uncorrupted talent.<br>
                        <span class="gate-highlight">💰 [M] Monetary:</span> Treasury - P2P liquidation & tax-cleared asset autonomy via Deel.<br>
                        <span class="gate-highlight">🎬 [O] Original:</span> Black Assembly - Protected investigative journalism & voice integrity.<br>
                        <span class="gate-highlight">👑 [S] Sovereign:</span> Ultimate Purpose - Absolute mastery over your financial and physical reality.<br><br>
                        <span class="gate-highlight">Breathe in the calm of truth.. Feel the moment approach when presenting your proof of existence and passport unlocks the Golden Visa into timeless sovereignty...</span>
                    `,
                    privacy: "Rest assured; let deep peace wash over you knowing your consciousness is safe. When the time comes for full passage, your passport will serve as your self-sovereign key to claim the Golden Visa, locally encrypted via Zero-Knowledge Proofs (ZK-Proofs).",
                    money: "Capital inside the Treasury is never seized or locked. All settlements execute via Peer-to-Peer (P2P) channels and compliant international advisory bridges."
                }
            }
        };

        const magicConsole = document.getElementById('magicConsole');
        const manifestOutput = document.getElementById('manifestOutput');
        const brandHeader = document.getElementById('brandHeader');
        const statusAnchor = document.getElementById('statusAnchor');
        const cursorGlow = document.getElementById('cursorGlow');

        /* تتبع الماوس للتوهج */
        window.addEventListener('mousemove', (e) => {
            cursorGlow.style.left = e.clientX + 'px';
            cursorGlow.style.top = e.clientY + 'px';
        });

        /* نظام الجسيمات */
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 1.5 + 0.5;
                this.speedY = -(Math.random() * 0.3 + 0.1);
                this.opacity = Math.random() * 0.5 + 0.1;
            }
            update() {
                this.y += this.speedY;
                if (this.y < 0) {
                    this.y = canvas.height;
                    this.x = Math.random() * canvas.width;
                }
            }
            draw() {
                ctx.fillStyle = `rgba(229, 169, 59, ${this.opacity})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        for (let i = 0; i < 45; i++) {
            particles.push(new Particle());
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animateParticles);
        }
        animateParticles();

        /* إدارة اللغات والتفاعل */
        function applyLanguageSettings() {
            const langData = i18n[currentLang];
            document.documentElement.lang = currentLang;
            document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
            document.body.style.fontFamily = currentLang === 'ar' ? 'var(--font-ar)' : 'var(--font-en)';
            
            magicConsole.placeholder = langData.placeholder;
            if(!statusAnchor.innerText.includes('جاري الاتصال') && !statusAnchor.innerText.includes('Connecting')) {
                statusAnchor.innerText = langData.waiting;
            }
        }

        magicConsole.addEventListener('input', function() {
            const val = this.value.trim();
            if (val.length === 0) {
                if(currentLang !== 'ar') {
                    currentLang = 'ar';
                    applyLanguageSettings();
                }
                return; 
            }

            const isArabic = /[\u0600-\u06FF]/.test(val);
            const newLang = isArabic ? 'ar' : 'en';

            if (newLang !== currentLang) {
                currentLang = newLang;
                applyLanguageSettings();
            }
        });

        magicConsole.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                const query = magicConsole.value.trim().toLowerCase();
                if (!query) return;

                const langData = i18n[currentLang];
                statusAnchor.innerText = langData.connecting;
                statusAnchor.style.color = "var(--cyber-gold)";
                
                const processedLang = currentLang; 
                magicConsole.value = '';

                setTimeout(() => {
                    brandHeader.style.transform = "scale(0.9) translateY(-10px)";
                    manifestOutput.style.display = "block";

                    if (query.match(/(خوف|أمان|بيانات|خصوصية|privacy|security|data)/)) {
                        typeWriter(i18n[processedLang].database.privacy, processedLang);
                    } else if (query.match(/(مال|ربح|فلوس|سحب|money|cash|withdraw)/)) {
                        typeWriter(i18n[processedLang].database.money, processedLang);
                    } else {
                        manifestOutput.innerHTML = i18n[processedLang].database.manifest;
                        statusAnchor.innerText = i18n[processedLang].success;
                        statusAnchor.style.color = "#fff";
                    }
                }, 600);
            }
        });

        function typeWriter(text, targetLang) {
            if (typingTimer) clearTimeout(typingTimer);
            manifestOutput.innerHTML = '';
            let i = 0;

            function type() {
                if (i < text.length) {
                    manifestOutput.innerHTML += text.charAt(i);
                    i++;
                    typingTimer = setTimeout(type, 15);
                } else {
                    statusAnchor.innerText = i18n[targetLang].processed;
                    statusAnchor.style.color = "#fff";
                }
            }
            type();
        }

        applyLanguageSettings();
    </script>
</body>
</html>
