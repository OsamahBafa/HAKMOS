<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>HAKMOS</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #03040a; }
  canvas { display: block; width: 100%; height: 100%; }
  #info {
    position: fixed; bottom: 20px; left: 0; right: 0;
    text-align: center; color: rgba(200,230,255,0.7);
    font-family: sans-serif; font-size: 14px; z-index: 10;
    pointer-events: none;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="info">حرّك إصبعك أو الماوس • المس الدوائر</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W, H, CX, CY;
let time = 0;
let mouse = { x: 0, y: 0, active: false };
let nodes = [];
let energy = 0;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  CX = W / 2;
  CY = H / 2;
  
  // إنشاء العقد
  nodes = [];
  const labels = ['H', 'A', 'K', 'M', 'O', 'S'];
  for (let i = 0; i < 6; i++) {
    const angle = -Math.PI/2 + (i - 2.5) * 0.45;
    nodes.push({
      label: labels[i],
      angle: angle,
      x: 0,
      y: 0
    });
  }
}

function draw() {
  // خلفية
  ctx.fillStyle = '#03040a';
  ctx.fillRect(0, 0, W, H);

  // توهج خلفي
  const bg = ctx.createRadialGradient(CX, CY, 0, CX, CY, Math.max(W, H) * 0.6);
  bg.addColorStop(0, 'rgba(20, 60, 100, 0.4)');
  bg.addColorStop(1, 'rgba(3, 4, 10, 0)');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  // النواة الرئيسية (الكائن)
  const pulse = 1 + Math.sin(time * 1.5) * 0.08 + energy * 0.1;
  const radius = Math.min(W, H) * 0.18 * pulse;

  // طبقات النواة
  for (let i = 5; i >= 0; i--) {
    const r = radius * (1 + i * 0.12);
    const g = ctx.createRadialGradient(CX, CY, 0, CX, CY, r);
    g.addColorStop(0, `rgba(100, 200, 255, ${0.15 - i * 0.02})`);
    g.addColorStop(0.6, `rgba(40, 120, 200, ${0.08 - i * 0.01})`);
    g.addColorStop(1, 'rgba(10, 40, 80, 0)');
    ctx.beginPath();
    ctx.arc(CX, CY, r, 0, Math.PI * 2);
    ctx.fillStyle = g;
    ctx.fill();
  }

  // الدائرة الأساسية
  ctx.beginPath();
  ctx.arc(CX, CY, radius, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(30, 100, 180, 0.3)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(100, 200, 255, 0.6)';
  ctx.lineWidth = 2;
  ctx.stroke();

  // كتابة HAKMOS في المركز
  ctx.save();
  ctx.font = `900 ${Math.min(W, H) * 0.045}px Orbitron`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = 'rgba(255, 230, 150, 0.95)';
  ctx.shadowColor = 'rgba(0, 200, 255, 0.8)';
  ctx.shadowBlur = 20;
  ctx.fillText('HAKMOS', CX, CY);
  ctx.restore();

  // العقد الستة
  const orbitR = Math.min(W, H) * 0.34;
  nodes.forEach((node, i) => {
    const a = node.angle + time * 0.3;
    node.x = CX + Math.cos(a) * orbitR;
    node.y = CY + Math.sin(a) * orbitR;

    const dist = Math.hypot(mouse.x - node.x, mouse.y - node.y);
    const isNear = dist < 40;

    // توهج العقدة
    const ng = ctx.createRadialGradient(node.x, node.y, 0, node.x, node.y, isNear ? 40 : 25);
    ng.addColorStop(0, isNear ? 'rgba(255, 220, 100, 0.5)' : 'rgba(80, 180, 255, 0.3)');
    ng.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.beginPath();
    ctx.arc(node.x, node.y, isNear ? 40 : 25, 0, Math.PI * 2);
    ctx.fillStyle = ng;
    ctx.fill();

    // جسم العقدة
    ctx.beginPath();
    ctx.arc(node.x, node.y, isNear ? 16 : 12, 0, Math.PI * 2);
    ctx.fillStyle = isNear ? 'rgba(255, 220, 120, 0.95)' : 'rgba(100, 190, 255, 0.7)';
    ctx.fill();

    // الحرف
    ctx.font = `700 ${isNear ? 14 : 12}px Orbitron`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = isNear ? '#111' : '#022';
    ctx.fillText(node.label, node.x, node.y + 1);

    if (isNear) energy = Math.min(1, energy + 0.02);
  });

  // تأثير عند اللمس
  if (mouse.active) {
    const g = ctx.createRadialGradient(mouse.x, mouse.y, 0, mouse.x, mouse.y, 120);
    g.addColorStop(0, 'rgba(100, 200, 255, 0.15)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.beginPath();
    ctx.arc(mouse.x, mouse.y, 120, 0, Math.PI * 2);
    ctx.fillStyle = g;
    ctx.fill();
  }

  energy *= 0.98;
}

function loop() {
  time += 0.016;
  draw();
  requestAnimationFrame(loop);
}

// أحداث
window.addEventListener('resize', resize);

canvas.addEventListener('mousemove', e => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
  mouse.active = true;
});

canvas.addEventListener('mouseleave', () => mouse.active = false);

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  const t = e.touches[0];
  mouse.x = t.clientX;
  mouse.y = t.clientY;
  mouse.active = true;
}, {passive: false});

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  const t = e.touches[0];
  mouse.x = t.clientX;
  mouse.y = t.clientY;
  mouse.active = true;
}, {passive: false});

canvas.addEventListener('touchend', () => mouse.active = false);

// تشغيل
resize();
loop();
</script>
</body>
</html>
