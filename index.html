<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HAKMOS | Cyber Sovereign Protocol v129</title>
    
    <!-- استدعاء أحدث خطوط المستقبل والسيادة لعام 2026 -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Cairo:wght@200;300;400;700&family=Orbitron:wght@400;600;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-deep: #020203;
            --cyber-gold: #E5A93B;
            --cyber-gold-glow: rgba(229, 169, 59, 0.25);
            --text-neon: #FFFFFF;
            --text-dim: #55555A;
            --grid-line: rgba(229, 169, 59, 0.015);
            --font-ar: 'Cairo', sans-serif;
            --font-en: 'Orbitron', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-neon);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            /* شبكة المصفوفة السيبرانية الخلفية حماية من التقليد */
            background-image: 
                linear-gradient(to right, var(--grid-line) 1px, transparent 1px),
                linear-gradient(to bottom, var(--grid-line) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        /* درع التوهج النبضي المركزي المحيط بالكونسول */
        body::before {
            content: '';
            position: absolute;
            width: 700px;
            height: 700px;
            background: radial-gradient(circle, rgba(229, 169, 59, 0.035) 0%, rgba(0,0,0,0) 75%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1;
            pointer-events: none;
        }

        .cyber-shell {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 650px;
            padding: 30px;
            text-align: center;
        }

        /* حاوية العنوان المزدوجة المتزامن حركياً باللغتين */
        .title-container {
            position: relative;
            height: 90px;
            margin-bottom: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .brand-title {
            position: absolute;
            font-family: var(--font-en);
            font-weight: 900;
            font-size: 3.8rem;
            letter-spacing: 18px;
            text-indent: 18px;
            text-transform: uppercase;
            background: linear-gradient(180deg, #FFFFFF 0%, #A5A5A8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: textGlitch 8s infinite alternate;
        }

        /* القاعدة الحركية للاسم العربي الفاخر */
        .brand-title::after {
            content: 'حـكـمـوس';
            position: absolute;
            top: 105%;
            left: 50%;
            transform: translateX(-50%);
            font-family: var(--font-ar);
            font-weight: 200;
            font-size: 1.15rem;
            letter-spacing: 8px;
            color: var(--cyber-gold);
            text-shadow: 0 0 10px var(--cyber-gold-glow);
            opacity: 0.8;
            text-indent: 8px;
        }

        /* مصفوفة الخلايا الضوئية المتجاوبة */
        .cyber-matrix {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 60px;
            width: 100%;
        }

        .matrix-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding: 14px 24px;
            background: rgba(255, 255, 255, 0.01);
            border: 1px solid rgba(255, 255, 255, 0.02);
            border-radius: 4px;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .matrix-row:hover {
            background: rgba(229, 169, 59, 0.02);
            border: 1px solid rgba(229, 169, 59, 0.25);
            box-shadow: 0 0 25px rgba(229, 169, 59, 0.06);
            transform: translateY(-2px);
        }

        .wing-ar {
            font-family: var(--font-ar);
            font-weight: 300;
            font-size: 1.15rem;
            color: rgba(255, 255, 255, 0.5);
            text-align: right;
            width: 35%;
            transition: color 0.3s;
        }

        .center-token {
            font-family: var(--font-en);
            font-weight: 600;
            color: var(--cyber-gold);
            font-size: 1.25rem;
            width: 30px;
            text-align: center;
            transition: text-shadow 0.3s;
        }

        .wing-en {
            font-family: var(--font-en);
            font-weight: 400;
            font-size: 0.95rem;
            color: var(--text-dim);
            text-align: left;
            width: 35%;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: color 0.3s;
        }

        .matrix-row:hover .wing-ar { color: var(--text-neon); font-weight: 400; }
        .matrix-row:hover .center-token { text-shadow: 0 0 15px var(--cyber-gold); }
        .matrix-row:hover .wing-en { color: var(--text-neon); }

        /* تريجر التنويم الإوخائي المجهول والمثير للفضول */
        .terminal-trigger {
            font-family: var(--font-ar);
            font-weight: 300;
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 3px;
            position: relative;
            display: inline-block;
        }

        .terminal-trigger::after {
            content: '_';
            color: var(--cyber-gold);
            animation: cursorPulse 1s step-end infinite;
            margin-right: 6px;
        }

        /* حركات التموج الإعجازي للشعار */
        @keyframes textGlitch {
            0%, 93%, 100% { filter: blur(0px); opacity: 1; }
            95% { filter: blur(1.5px); opacity: 0.85; color: var(--cyber-gold); }
            98% { filter: blur(0px); opacity: 1; }
        }

        @keyframes cursorPulse {
            from, to { opacity: 0; }
            50% { opacity: 1; }
        }

        /* تجاوب عتاد الهاتف وعرض الشاشة */
        @media (max-width: 768px) {
            .brand-title { font-size: 2.8rem; letter-spacing: 12px; text-indent: 12px; }
            .matrix-row { padding: 12px 16px; }
            .wing-ar { font-size: 1rem; }
            .wing-en { font-size: 0.8rem; letter-spacing: 1px; }
        }
    </style>
</head>
<body>

    <div class="cyber-shell">
        <!-- حاوية العنوان المزدوجة الفاخرة -->
        <div class="title-container">
            <div class="brand-title">Hakmos</div>
        </div>
        
        <!-- المصفوفة الجيومترية المزدوجة بالخطوط والأوزان المستقبلية الملفتة والمغرية للعين -->
        <div class="cyber-matrix">
            <div class="matrix-row">
                <div class="wing-ar">حكمة</div>
                <div class="center-token">H</div>
                <div class="wing-en">Holistic</div>
            </div>
            <div class="matrix-row">
                <div class="wing-ar">أمان</div>
                <div class="center-token">A</div>
                <div class="wing-en">Aligned</div>
            </div>
            <div class="matrix-row">
                <div class="wing-ar">كفاءة</div>
                <div class="center-token">K</div>
                <div class="wing-en">Kinetic</div>
            </div>
            <div class="matrix-row">
                <div class="wing-ar">مال</div>
                <div class="center-token">M</div>
                <div class="wing-en">Monetary</div>
            </div>
            <div class="matrix-row">
                <div class="wing-ar">وقار</div>
                <div class="center-token">O</div>
                <div class="wing-en">Original</div>
            </div>
            <div class="matrix-row">
                <div class="wing-ar">سيادة</div>
                <div class="center-token">S</div>
                <div class="wing-en">Sovereign</div>
            </div>
        </div>
        
        <!-- مرساة التنويم الإيحائي المستتر الصامتة -->
        <div class="terminal-trigger">حيث تبدأ الحقيقة.. وينتهي الزيف</div>
    </div>

</body>
</html>
