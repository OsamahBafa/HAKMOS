<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HAKMOS | Cyber Sovereign Protocol v130</title>
    
    <!-- استدعاء أحدث محركات الخطوط المستقبلية لعام 2026 -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Cairo:wght@200;300;400;700&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark-void: #010102;
            --gold-light: #F4C430;
            --gold-dark: #C5A028;
            --gold-glow: rgba(244, 196, 48, 0.3);
            --text-pure: #FFFFFF;
            --text-dim: #77777C;
            --panel-bg: rgba(255, 255, 255, 0.015);
            --panel-border: rgba(244, 196, 48, 0.08);
            --font-ar: 'Cairo', sans-serif;
            --font-en: 'Orbitron', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--bg-dark-void);
            color: var(--text-pure);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            /* خلفية مصفوفة الشبكة السيبرانية المعزولة */
            background-image: 
                linear-gradient(to right, rgba(244, 196, 48, 0.01) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(244, 196, 48, 0.01) 1px, transparent 1px);
            background-size: 50px 50px;
        }

        /* هالة التوهج النبضي المركزي المحيط بالكونسول */
        body::before {
            content: '';
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(244, 196, 48, 0.04) 0%, rgba(0,0,0,0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1;
            pointer-events: none;
        }

        .cinematic-container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 680px;
            padding: 40px ٢0px;
            text-align: center;
        }

        /* عنوان المونوكورب السيبراني المزدوج الفاخر */
        .brand-header {
            position: relative;
            margin-bottom: 48px;
        }

        .main-logo {
            font-family: var(--font-en);
            font-weight: 900;
            font-size: 4rem;
            letter-spacing: 20px;
            text-indent: 20px;
            text-transform: uppercase;
            background: linear-gradient(180deg, #FFFFFF 30%, var(--gold-light) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 15px rgba(244, 196, 48, 0.15));
            animation: fluidPulse 4s ease-in-out infinite;
        }

        .sub-logo {
            font-family: var(--font-ar);
            font-weight: 200;
            font-size: 1.1rem;
            letter-spacing: 10px;
            text-indent: 10px;
            color: var(--gold-dark);
            margin-top: 8px;
            opacity: 0.8;
            text-transform: uppercase;
        }

        /* مصفوفة الكبسولات الضوئية العمودية المستقلة */
        .matrix-viewport {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 56px;
            width: 100%;
        }

        .capsule-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding: 16px 28px;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 6px;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            backdrop-filter: blur(10px);
        }

        .capsule-row:hover {
            background: rgba(244, 196, 48, 0.02);
            border: 1px solid var(--gold-light);
            box-shadow: 0 0 30px rgba(244, 196, 48, 0.12);
            transform: scale(1.02) translateY(-2px);
        }

        .wing-ar {
            font-family: var(--font-ar);
            font-weight: 300;
            font-size: 1.2rem;
            color: rgba(255, 255, 255, 0.6);
            text-align: right;
            width: 35%;
            transition: color 0.3s;
        }

        .center-node {
            font-family: var(--font-en);
            font-weight: 700;
            color: var(--gold-light);
            font-size: 1.4rem;
            width: 40px;
            text-align: center;
            text-shadow: 0 0 10px var(--gold-glow);
            transition: all 0.3s;
        }

        .wing-en {
            font-family: var(--font-en);
            font-weight: 500;
            font-size: 0.95rem;
            color: var(--text-dim);
            text-align: left;
            width: 35%;
            text-transform: uppercase;
            letter-spacing: 3px;
            transition: color 0.3s;
        }

        .capsule-row:hover .wing-ar { color: var(--text-pure); font-weight: 400; }
        .capsule-row:hover .center-node { text-shadow: 0 0 20px var(--gold-light); transform: scale(1.15); }
        .capsule-row:hover .wing-en { color: var(--text-pure); letter-spacing: 4px; }

        /* مرساة التنويم الإوخائي المجهول والمثير للفضول والغرائز */
        .terminal-anchor {
            font-family: var(--font-ar);
            font-weight: 300;
            font-size: 1.05rem;
            color: rgba(255, 255, 255, 0.45);
            letter-spacing: 4px;
            border-top: 1px solid rgba(255, 255, 255, 0.03);
            padding-top: 36px;
            display: inline-block;
            width: 80%;
        }

        .terminal-anchor::after {
            content: '_';
            color: var(--gold-light);
            animation: blinker 1s step-end infinite;
            margin-right: 6px;
        }

        /* حركات التموج الإعجازي الفاخرة */
        @keyframes fluidPulse {
            0% { opacity: 0.4; filter: blur(1px); transform: scale(0.99); }
            50% { opacity: 1; filter: blur(0px); transform: scale(1); }
            100% { opacity: 0.4; filter: blur(1px); transform: scale(0.99); }
        }

        @keyframes blinker {
            from, to { opacity: 0; }
            50% { opacity: 1; }
        }

        /* تجاوب شاشة هاتف سامسونج المخصص وعرض الأبعاد */
        @media (max-width: 768px) {
            .main-logo { font-size: 2.8rem; letter-spacing: 14px; text-indent: 14px; }
            .sub-logo { font-size: 0.95rem; letter-spacing: 6px; text-indent: 6px; }
            .capsule-row { padding: 12px 20px; }
            .wing-ar { font-size: 1.05rem; }
            .wing-en { font-size: 0.8rem; letter-spacing: 2px; }
        }
    </style>
</head>
<body>

    <div class="cinematic-container">
        <!-- هيدر العنوان المزدوج الفاخر باللغتين ككتلة واحدة مدمجة -->
        <div class="brand-header">
            <div class="main-logo">Hakmos</div>
            <div class="sub-logo">حـكـمـوس</div>
        </div>
        
        <!-- المصفوفة الجيومترية للكبسولات المضيئة والمغرية للعين -->
        <div class="matrix-viewport">
            <div class="capsule-row">
                <div class="wing-ar">حكمة</div>
                <div class="center-node">H</div>
                <div class="wing-en">Holistic</div>
            </div>
            <div class="capsule-row">
                <div class="wing-ar">أمان</div>
                <div class="center-node">A</div>
                <div class="wing-en">Aligned</div>
            </div>
            <div class="capsule-row">
                <div class="wing-ar">كفاءة</div>
                <div class="center-node">K</div>
                <div class="wing-en">Kinetic</div>
            </div>
            <div class="capsule-row">
                <div class="wing-ar">مال</div>
                <div class="center-node">M</div>
                <div class="wing-en">Monetary</div>
            </div>
            <div class="capsule-row">
                <div class="wing-ar">وقار</div>
                <div class="center-node">O</div>
                <div class="wing-en">Original</div>
            </div>
            <div class="capsule-row">
                <div class="wing-ar">سيادة</div>
                <div class="center-node">S</div>
                <div class="wing-en">Sovereign</div>
            </div>
        </div>
        
        <!-- تريجر التنويم المستتر المثير للفضول والغرائز النفعية -->
        <div class="terminal-anchor">حيث تبدأ الحقيقة.. وينتهي الزيف</div>
    </div>

</body>
</html>
