<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HAKMOS | السيادة المطلقة</title>
    <style>
        body { background-color: #000; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; overflow: hidden; }
        .console { text-align: center; }
        h1 { font-size: 4rem; letter-spacing: 15px; margin-bottom: 20px; animation: pulse 3s infinite; }
        .backronym { font-size: 1.2rem; color: #888; margin-bottom: 40px; }
        .backronym span { color: #d4af37; font-weight: bold; }
        .message { font-size: 1rem; letter-spacing: 2px; color: #555; }
        @keyframes pulse { 0% { opacity: 0.3; } 50% { opacity: 1; } 100% { opacity: 0.3; } }
    </style>
</head>
<body>
    <div class="console">
        <h1>HAKMOS</h1>
        <div class="backronym">
            <span>H</span> حكمة | <span>A</span> أمان | <span>K</span> كفاءة | <span>M</span> مال | <span>O</span> وقار | <span>S</span> سيادة
        </div>
        <div class="message">قريباً.. حيث تبدأ الحقيقة وينتهي الزيف.</div>
    </div>
</body>
</html>
