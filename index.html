<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HAKMOS | Cyber Sovereign Protocol v133</title>
    
    <!-- استدعاء أحدث محركات الخطوط المستقبلية لعام 2026 -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Cairo:wght@200;300;400;700&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-void: #010102;
            --cyber-gold: #E5A93B;
            --cyber-gold-glow: rgba(229, 169, 59, 0.2);
            --text-pure: #FFFFFF;
            --text-dim: #6E6E73;
            --panel-border: rgba(229, 169, 59, 0.08);
            --font-ar: 'Cairo', sans-serif;
            --font-en: 'Orbitron', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background-color: var(--bg-void); color: var(--text-pure); height: 100vh;
            display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative;
            background-image: linear-gradient(to right, rgba(229, 169, 59, 0.01) 1px, transparent 1px), linear-gradient(to bottom, rgba(229, 169, 59, 0.01) 1px, transparent 1px);
            background-size: 50px 50px;
        }

        body::before {
            content: ''; position: absolute; width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(229, 169, 59, 0.03) 0%, rgba(0,0,0,0) 70%);
            top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 1; pointer-events: none;
        }

        .cinematic-container { position: relative; z-index: 2; width: 100%; max-width: 720px; padding: 20px; text-align: center; }
        .brand-header { margin-bottom: 32px; transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1); }
        .main-logo {
            font-family: var(--font-en); font-weight: 900; font-size: 3.8rem; letter-spacing: 20px; text-indent: 20px; text-transform: uppercase;
            background: linear-gradient(180deg, #FFFFFF 30%, var(--cyber-gold) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 15px rgba(229, 169, 59, 0.15));
        }

        .console-box { width: 100%; max-width: 540px; margin: 0 auto 32px auto; position: relative; }
        .console-input {
            width: 100%; background: rgba(255, 255, 255, 0.01); border: 1px solid var(--panel-border);
            border-radius: 4px; padding: 18px 24px; color: var(--text-pure); font-family: var(--font-ar);
            font-size: 1.1rem; text-align: center; outline: none; transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            letter-spacing: 0.5px;
        }
        .console-input:focus { border: 1px solid var(--cyber-gold); box-shadow: 0 0 25px var(--cyber-gold-glow); background: rgba(229, 169, 59, 0.015); }

        .manifest-output {
            max-height: 340px; overflow-y: auto; font-family: var(--font-ar); font-size: 1.05rem; text-align: justify;
            line-height: 1.8; color: rgba(255, 255, 255, 0.85); padding: 0 24px; margin-bottom: 32px; display: none;
            border-right: 2px solid var(--cyber-gold); background: rgba(255, 255, 255, 0.005);
        }
        .manifest-output::-webkit-scrollbar { width: 4px; }
        .manifest-output::-webkit-scrollbar-thumb { background: var(--panel-border); border-radius: 2px; }

        .gate-highlight { color: var(--cyber-gold); font-weight: 700; font-family: var(--font-en); display: inline-block; margin-left: 6px; }
        .terminal-anchor { font-family: var(--font-ar); font-weight: 300; font-size: 0.95rem; color: var(--text-dim); letter-spacing: 3px; transition: color 0.3s; }

        @media (max-width: 768px) {
            .main-logo { font-size: 2.8rem; letter-spacing: 14px; text-indent: 14px; }
            .console-input { font-size: 0.95rem; padding: 14px 18px; }
            .manifest-output { font-size: 0.95rem; padding: 0 12px; }
        }
    </style>
</head>
<body>

    <div class="cinematic-container">
        <div class="brand-header" id="brandHeader">
            <div class="main-logo">Hakmos</div>
        </div>
        
        <div class="manifest-output" id="manifestOutput"></div>

        <div class="console-box">
            <input type="text" class="console-input" id="magicConsole" placeholder="اطرح مخاوفك، شكوكك، أو بريدك الإلكتروني لفتح الأبعاد..." autocomplete="off">
        </div>
        
        <div class="terminal-anchor" id="statusAnchor">بانتظار أمر السيادة المكتوب_</div>
    </div>

    <script>
        const magicConsole = document.getElementById('magicConsole');
        const manifestOutput = document.getElementById('manifestOutput');
        const brandHeader = document.getElementById('brandHeader');
        const statusAnchor = document.getElementById('statusAnchor');

                منصة <span class="gate-highlight">HAKMOS</span> تفتح بوابات معقلها الغامض والفاخر لأول مرة. نحن لا نقدم تطبيقاً برمجياً للتصفح والعبث؛ نحن نطلق بروتوكول الحياة الحقيقي السداسي الموحد والمصان بأقوى الأقفال السيادية وجوازات السفر البشرية النقية الموثقة:<br><br>
                <span class="gate-highlight">🩺 [H] Holistic (العيادة السيادية):</span> مسار فحصك الطبي وعلاجك العشبي البيولوجي النظيف وتتبع ملفك الدائم طوال العمر بصفر خصوصية مستباحة وبحظر كامل للطوارئ وتوجيهها للإسعاف حماية لرخصتنا الجنائية.<br><br>

                <span class="gate-highlight">💼 [K] Kinetic (محرك الارتقاء):</span> اقتناص مهني وتوظيف أعمى يسحق المحسوبية ويقدس الموهبة الفردية، مع ربط المنح والجامعات عابرة الحدود بـ ٢٤ لغة دون وسيط عمالي.<br><br>
                <span class="gate-highlight">💰 [M] Monetary (بيت المال):</span> إدارة أموال الزكاة والمنح، والمزادات النخبوية العالمية للأصول والعقارات ببروتوكول التسجيل المشروط، وسحب ثروتك الطائلة كاش ليدك بنقاء ضريبي ومصرفي 100% عبر جسر Deel الاستشاري الدولي.<br><br>
                <span class="gate-highlight">🎬 [O] Original (الديوان الأسود):</span> مطارحات فكرية، وبثوث مدفوعة ومكافآت لتعدين انتباه المتابعين، وصحافة استقصائية عمياء محمية من استنساخ البصمة الصوتية بدرع التمويج السمعي الصارم.<br><br>
                <span class="gate-highlight">👑 [S] Sovereign (الهدف الأسمى):</span> استعادة التحكم الكامل والمطلق في مصيرك المالي والصحي والاجتماعي فوق قارات الأرض.<br><br>
                المنصة صامتة، جافة، فاخرة، ولا تقبل العبث أو الحسابات الوهمية. لن يدخل هذا العالم الفسيح إلا من بايع الحقيقة، وثبتت جدارته الفكرية، وفعّل تأشيرته الذهبية بجواز سفره الرسمي لمرة واحدة طوال العمر ليفك قفل عوالم الأمان النفعي والارتقاء الخالد.<br><br>
                <span class="gate-highlight">قم بمسح جواز سفرك الآن داخل التطبيق لكسر ستار الغموض والعبور الفوري للسيادة...</span>
            `,
            privacy: "أرح عقلك ونفسك تماماً؛ لعلك تشعر الآن بموجة عميقة من الراحة والأمان، وأنت تدرك أن بياناتك وجيناتها وجواز سفرك مشفرة عتادياً بالكامل بصيغة التشفير الصفرى (ZK-Proofs) محلياً داخل جهازك البنكي الفردي. المنصة لا تخزن هويتك لتبيعها؛ بل تحميك من تتبع الدول ومكابح البنوك المركزية بالكامل وتجعل وعيك معزولاً ومصاناً. اكتب 'نداء' لقراءة البيان التأسيسي الحركي كاملاً.",
            money: "الأموال والرسوم وعمولات التوظيف والمزادات داخل بيت المال لا يتم احتجازها ولا مصادرتها كلياً؛ كل التسييل المالي الحركي يتم خارج التطبيق بنظام المقاصة بالند للند (P2P) ويصل ليدك كاش ونقداً بالعملة المحلية بصيغة راتب استشاري دولي مطهر ضريبياً 100% عبر عقود وسيط الرواتب الممتثل Deel وبصفر رادارات بنكية مشبوهة. اكتب 'نداء' لفتح مصفوفة الكسب السيادي."
        };

        magicConsole.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                const query = magicConsole.value.trim().toLowerCase();
                if (!query) return;

                statusAnchor.innerText = "جاري الاتصال بـ بروتوكول الحقيقة وتدقيق الهوية العتادية...";
                statusAnchor.style.color = "var(--cyber-gold)";
                magicConsole.value = '';

                setTimeout(() => {
                    brandHeader.style.transform = "scale(0.9) translateY(-10px)";
                    manifestOutput.style.display = "block";

                    if (query.includes('خوف') || query.includes('أمان') || query.includes('بيانات') || query.includes('خصوصية') || query.includes('privacy')) {
                        typeWriter(database.privacy);
                    } else if (query.includes('مال') || query.includes('ربح') || query.includes('فلوس') || query.includes('سحب') || query.includes('money')) {
                        typeWriter(database.money);
                    } else {
                        manifestOutput.innerHTML = database.manifest;
                        statusAnchor.innerText = "تم بث نداء العبور الأول بنجاح وسحق الزيف_";
                        statusAnchor.style.color = "#fff";
                    }
                }, 800);
            }
        });

        function typeWriter(text) {
            manifestOutput.innerHTML = '';
            let i = 0;
            function type() {
