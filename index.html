<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HAKMOS | Protocol v127</title>
    
    <!-- استدعاء الخطوط العصرية المتغيرة لعام 2026 -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Cairo:wght@200;400;700&family=Plus+Jakarta+Sans:ital,wght@0,200;0,400;0,700;1,400&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-pure: #050505;
            --accent-gold: #D4AF37;
            --text-high: #F5F5F7;
            --text-muted: #6E6E73;
            --console-glow: rgba(212, 175, 55, 0.06);
            --font-ar: 'Cairo', sans-serif;
            --font-en: 'Plus Jakarta Sans', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--bg-pure);
            color: var(--text-high);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* مصفوفة التوهج الخلفي الكوني */
        body::before {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, var(--console-glow) 0%, rgba(0,0,0,0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1;
            pointer-events: none;
        }

        .cinematic-shell {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 680px;
            padding: 40px;
            text-align: center;
        }

        /* الشعار الأحادي الضخم والفخم */
        .brand-core {
            font-family: var(--font-en);
            font-weight: 200;
            font-size: 4.8rem;
            letter-spacing: 24px;
            color: var(--text-high);
            text-indent: 24px; /* لضبط المحاذاة في المنتصف تماماً */
            text-transform: uppercase;
            margin-bottom: 24px;
            animation: deepPulse 4s cubic-bezier(0.25, 1, 0.5, 1) infinite;
        }

        /* مصفوفة الدستور الحرفي الموزع عريضاً */
        .sovereign-matrix {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 56px;
        }

        .matrix-node {
            font-family: var(--font-ar);
            font-weight: 200;
            font-size: 1.15rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            transition: color 0.4s ease;
        }

        .matrix-node span {
            font-family: var(--font-en);
            font-weight: 700;
            color: var(--accent-gold);
            margin-left: 6px;
            font-size: 1.1rem;
        }

        .matrix-node:hover {
            color: var(--text-high);
        }

        /* كونسول التنبيه والمؤشر النابض للبوابة */
        .console-trigger {
            font-family: var(--font-ar);
            font-weight: 400;
            font-size: 1rem;
            color: var(--text-muted);
            letter-spacing: 2px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            padding-top: 32px;
            display: inline-block;
            width: 85%;
        }

        .console-trigger::after {
            content: '_';
            color: var(--accent-gold);
            animation: terminalBlink 1s step-end infinite;
            margin-right: 4px;
        }

        /* حركة النبض العميقة فائقة النعومة */
        @keyframes deepPulse {
            0% { opacity: 0.3; filter: blur(1.5px); transform: scale(0.98); }
            50% { opacity: 1; filter: blur(0px); transform: scale(1); }
            100% { opacity: 0.3; filter: blur(1.5px); transform: scale(0.98); }
        }

        @keyframes terminalBlink {
            from, to { opacity: 0; }
            50% { opacity: 1; }
        }

        /* توافق الشاشات المتجاوب للهواتف */
        @media (max-width: 768px) {
            .brand-core { font-size: 3.2rem; letter-spacing: 16px; text-indent: 16px; }
            .sovereign-matrix { gap: 12px; }
            .matrix-node { font-size: 1rem; }
        }
    </style>
</head>
<body>

    <div class="cinematic-shell">
        <!-- الشعار الرئيسي النخبوي -->
        <div class="brand-core">Hakmos</div>
        
        <!-- التفكيك الحرفي دقيق المحاذاة والوزن الخطّي -->
        <div class="sovereign-matrix">
            <div class="matrix-node"><span>H</span>حكمة</div>
            <div class="matrix-node"><span>A</span>أمان</div>
            <div class="matrix-node"><span>K</span>كفاءة</div>
            <div class="matrix-node"><span>M</span>مال</div>
            <div class="matrix-node"><span>O</span>وقار</div>
            <div class="matrix-node"><span>S</span>سيادة</div>
        </div>
        
        <!-- مؤشر التنويم الإوخائي الميكروي -->
        <div class="console-trigger">حيث تبدأ الحقيقة.. وينتهي الزيف</div>
    </div>

</body>
</html>
